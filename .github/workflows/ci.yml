name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Lint
        run: mvn -B checkstyle:check

      - name: Package
        run: mvn -B -DskipTests package

      - name: Build Docker image
        run: docker build --tag order-report-cli:${{ github.sha }} .
