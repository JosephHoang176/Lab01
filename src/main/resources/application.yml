spring:
  application:
    name: order-report-cli

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=OrderReportDb;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:orderapp}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1

  cloud:
    openfeign:
      client:
        config:
          pricing-service:
            connectTimeout: 1000
            readTimeout: 2000

server:
  port: ${SERVER_PORT:8080}

pricing:
  service:
    url: ${PRICING_SERVICE_URL:http://localhost:8081}

logging:
  structured:
    format:
      console: logstash
  level:
    org.example: INFO

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

info:
  app:
    name: order-report-cli
    description: Orders Service
    version: 1.0-SNAPSHOT