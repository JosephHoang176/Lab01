spring:
  application:
    name: order-report-cli

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=OrderReportDb;encrypt=true;trustServerCertificate=true
    username: orderapp
    password: hoang123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  profiles:
    default: dev

server:
  port: 8080

security:
  jwt:
    secret: change-this-development-secret-to-a-strong-32-byte-value
    access-token-minutes: 15
    refresh-token-days: 7

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

info:
  app:
    name: order-report-cli
    description: Mini Orders API
    version: 1.0-SNAPSHOT