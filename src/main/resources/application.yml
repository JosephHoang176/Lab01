spring:
  application:
    name: order-report-cli

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=OrderReportDb;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:orderapp}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      naming:
        physical-strategy: org.example.config.CorePhysicalNamingStrategy

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  profiles:
    default: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

info:
  app:
    name: order-report-cli
    description: Mini Orders API
    version: 1.0-SNAPSHOT

payment:
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET:}
  provider:
    timeout-ms: ${PAYMENT_PROVIDER_TIMEOUT_MS:2000}
    max-retries: ${PAYMENT_PROVIDER_MAX_RETRIES:3}
    initial-backoff-ms: ${PAYMENT_PROVIDER_INITIAL_BACKOFF_MS:100}
    max-backoff-ms: ${PAYMENT_PROVIDER_MAX_BACKOFF_MS:2000}
  mock:
    delay-ms: ${PAYMENT_MOCK_DELAY_MS:0}

messaging:
  orders:
    exchange: ${ORDERS_EXCHANGE:orders.exchange}
    paid-routing-key: ${ORDER_PAID_ROUTING_KEY:order.paid}

app:
  invoice:
    storage-dir: ${INVOICE_STORAGE_DIR:./data/invoices}