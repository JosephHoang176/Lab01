services:
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      PRICING_SERVICE_URL: http://pricing-service:8081
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      pricing-service:
        condition: service_started

  pricing-service:
    build:
      context: ../pricing-order-cli
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
